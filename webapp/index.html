<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coffee Extraction Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles/styles.css" />
</head>
<body>
  <!-- Blurred brown-gold background blobs -->
  <div class="backdrop" aria-hidden="true">
    <span class="blob blob-gold"></span>
    <span class="blob blob-brown"></span>
    <span class="blob blob-amber"></span>
  </div>

  <main class="app">
    <nav class="tabs" role="tablist" aria-label="Views">
      <button class="tab" role="tab" data-view="extraction" aria-selected="true">Extraction</button>
      <button class="tab" role="tab" data-view="coffee" aria-selected="false">Coffee</button>
      <button class="tab" role="tab" data-view="history" aria-selected="false">History</button>
    </nav>

    <!-- Views are injected by the JS view modules -->
    <section id="view-extraction" class="view" role="tabpanel"></section>
    <section id="view-coffee" class="view" role="tabpanel" hidden></section>
    <section id="view-history" class="view" role="tabpanel" hidden></section>
  </main>

  <script type="module" src="scripts/app.js"></script>
</body>
</html>

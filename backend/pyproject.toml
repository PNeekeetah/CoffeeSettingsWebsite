[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coffee-settings-backend"
version = "0.1.0"
description = "Coffee settings backend API"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.115.0",
    "psycopg[binary]>=3.3.4",
    "sqlalchemy[psycopg]>=2.0.51",
    "uvicorn>=0.34.0",
]

[tool.setuptools]
packages = ["app"]
